<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sacha</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tagesschrift&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="#section1">Inicio</a>
        <a href="#section2">Humildes</a>
        <a href="#section3">Goats</a>
        <a href="#section4">Sus</a>
        <a href="#section5">Plazas</a>
        <a href="#section6">Lugar definitivo</a>
    </nav>
    <section id="section1">
        <div class="texto-seccion1">
            <p>Encontrando la casita o lugar de tus sueños</p>
        </div>
    </section>    
    <section id="section2">
        <input type="radio" name="primeros" id="text1" class="input1">
        <label for="text1" class="texto1-seccion2">
                <p>Lugar con comida incluida, asi bien deliciosa como para nunca morir de hambre</p>
        </label>
        <input type="radio" name="primeros" id="text2" class="input2">
        <label for="text2" class="texto2-seccion2">
                <p>casita asi bien colorida lista para invitar a tus papus para pasar el time :v</p>
        </label>
    </section> 
    <section id="section3">
        <input type="radio" name="segundos" id="text3" class="input3">
        <label for="text3" class="texto1-seccion3">
                <p>Lugar con farmacia incluida por si por accidente te caes del ultimo piso por pasarte de rosquilla</p>
                <img src="casita3.jpeg" alt="img3" width="80%">
        </label>
        <input type="radio" name="segundos" id="text4" class="input4">
        <label for="text4" class="texto2-seccion3">
                <p>Casita con salon de belleza para siempre estar belle y conquistar a la sachita</p>
                <img src="casita4.jpeg" alt="img4" width="90%">
        </label>
        <input type="radio" name="segundos" id="text5" class="input5">
        <label for="text5" class="texto3-seccion3">
                <p>Casita chill para estar chill como tio chill(el auto no viene incluido)</p>
                <img src="casita5.jpeg" alt="img5" width="90%">
        </label>
        <input type="radio" name="segundos" id="text6" class="input6">
        <label for="text6" class="texto4-seccion3">
                <p>la primera casita pero desde otro angulo para que pienses si vas a dejar esta oportunidad unica :v</p>
                <img src="casita6.jpeg" alt="img6" width="80%">
        </label>
    </section> 
    <section id="section4">
        <input type="radio" name="terceros" id="text7" class="input7">
        <label for="text7" class="texto1-seccion4">
                <p>Casita normal, ¿o talvez no?</p>
                <img src="casita7.jpeg" alt="img7" width="70%" class="img7">
                <img src="casita8.jpeg" alt="img8" width="80%" class="img8">
        </label>
        <input type="radio" name="terceros" id="text8" class="input8">
        <label for="text8" class="texto2-seccion4">
                <img src="casita9.jpeg" alt="img9" width="60%">
                <p>El lugar perfecto si es que siempre tienes sed pero no de agua xd</p>
        </label>
    </section> 
    <section id="section5">
        <input type="radio" name="cuartos" id="text9" class="input9">
        <label for="text9" class="texto1-seccion5">
                <p>Una plazita para convivir mas con las personas y tener dias frescos wasa</p>
        </label>
        <input type="radio" name="cuartos" id="text10" class="input10">
        <label for="text10" class="texto2-seccion5">
                <p>Otra plaza pero más amplia y goat</p>
        </label>
    </section>
    <section id="section6">
        <input type="radio" name="quinto" id="text11" class="input11">
        <label for="text11" >
                <p>Finalmente el mejor lugar que podras elegir en toda tu vida, ademas de ser espaciado y tener buen ambiente, podras conocer a tu idolo el Rayo McQueen (solo se puede ver una vez en la vida :v)</p>

        </label>
    </section>

</html>
